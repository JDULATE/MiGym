# Render.com blueprint — free tier, auto-deploy from GitHub.
# NOTE: free tier has NO persistent disk — /data resets on restart. MiGym is
# local-first, so devices keep their data; server-side sync data is ephemeral.
services:
  - type: web
    name: migym
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: RP_ID
        sync: false      # set to your domain, e.g. www.migym.dpdns.org
      - key: ORIGIN
        sync: false      # set to https://www.migym.dpdns.org
      - key: RP_NAME
        value: MiGym
      - key: SESSION_DAYS
        value: "90"
      - key: ADMIN_UIDS
        sync: false
      - key: COACH_UIDS
        sync: false
